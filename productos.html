<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos - Heladeria Sabores Unicos</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <img
        src="./img/logo.png"
        alt="Logo Heladería Sabores Únicos"
        class="logo"
      />
      <nav>
        <a href="./index.html">Inicio</a>
        <a href="./productos.html">Productos</a>
      </nav>
    </header>
    <main>
      <section class="sabores">
        <h2>Sabores ($ cada bocha)</h2>
        <div class="grid">
          <article>
            <img src="./img/chocolate.jpg" alt="chocolate" />
            <h3>Chocolate</h3>
            <p>$1000</p>
          </article>
          <article>
            <img src="./img/vainilla.jpg" alt="vainilla" />
            <h3>Vainilla</h3>
            <p>$900</p>
          </article>
          <article>
            <img src="./img/frutilla.jpg" alt="frutilla" />
            <h3>Frutilla</h3>
            <p>$850</p>
          </article>
        </div>
      </section>
      <section class="envases">
        <h2>Envases</h2>
        <div class="grid">
          <article>
            <img src="./img/vasito.jpg" alt="vasito" />
            <h3>Vasito</h3>
            <p>$500</p>
          </article>
          <article>
            <img src="./img/cucurucho.jpg" alt="cucurucho" />
            <h3>Cucurucho</h3>
            <p>$800</p>
          </article>
          <article>
            <img src="./img/cuarto-helado.jpg" alt="cuarto-helado" />
            <h3>Pote 1/4kg</h3>
            <p>$4000</p>
          </article>
        </div>
      </section>
      <section class="postres">
        <h2>Postres</h2>
        <div class="grid">
          <article>
            <img src="./img/bombon-escoces.jpg" alt="bombon-escoces" />
            <h3>Bombón Escocés</h3>
            <p>$6000 cada 1</p>
          </article>
          <article>
            <img src="./img/selva-negra.jpg" alt="selva-negra" />
            <h3>Selva Negra</h3>
            <p>$25000</p>
          </article>
          <article>
            <img src="./img/alfajor-helado.jpg" alt="alfajor-helado" />
            <h3>Alfajor Helado</h3>
            <p>$3000</p>
          </article>
        </div>
      </section>
    </main>
    <footer class="foot">
      <p>Plaza Sarmiento</p>
      <p>Instagram: @sabores-unicos</p>
      <p>© 2026</p>
    </footer>
  </body>
</html>
